name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        db: [sqlite, postgres]
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: cma_test
          POSTGRES_USER: cma
          POSTGRES_PASSWORD: cma
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cma -d cma_test" --health-interval 5s --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: ${{ matrix.db == 'postgres' && 'postgresql+psycopg://cma:cma@localhost:5432/cma_test' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt -r requirements-postgres.txt
      - name: Offline tests (ranking, pricing, workbook regression, refresh, API, reports)
        run: pytest -q
      - name: Live county service checks (read-only)
        if: matrix.db == 'sqlite'
        run: pytest -q -m live -k "not local_database"
        continue-on-error: true   # informational: depends on the county's public service

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t cma-app .
